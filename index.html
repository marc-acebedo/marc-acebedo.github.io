<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marc Acebedo — Data Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-top: #EEF2F6;
      --bg-bottom: #F8FAFC;
      --surface: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --navy: #1E3A5F;
      --navy-hover: #152A45;
      --green: #16A34A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 45%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 18px 48px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 118px;
      height: 118px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--surface);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
      background-color: var(--navy);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 17px;
      height: 17px;
      background-color: var(--green);
      border: 3px solid var(--surface);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 4px;
    }

    .location {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
    }

    .links-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px 18px;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      transition: transform 0.14s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      border-color: #CBD5E1;
    }

    .link-card:active {
      transform: scale(0.99);
    }

    .link-card.primary {
      background: linear-gradient(135deg, var(--navy) 0%, #274C77 100%);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(30, 58, 95, 0.22);
    }

    .link-card.primary:hover {
      background: linear-gradient(135deg, var(--navy-hover) 0%, #1E3A5F 100%);
      box-shadow: 0 10px 24px rgba(30, 58, 95, 0.28);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .primary .icon-box {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }

    .icon-linkedin {
      background: #EFF6FF;
      color: #0A66C2;
    }

    .icon-whatsapp {
      background: #F0FDF4;
      color: #16A34A;
    }

    .icon-email {
      background: #F1F5F9;
      color: #1E3A5F;
    }

    .link-text {
      display: flex;
      flex-direction: column;
    }

    .link-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
    }

    .link-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .primary .link-sub {
      color: rgba(255, 255, 255, 0.80);
    }

    .arrow-icon {
      color: #94A3B8;
      flex-shrink: 0;
    }

    .primary .arrow-icon {
      color: rgba(255, 255, 255, 0.80);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar-wrapper" id="avatarContainer">
      <div class="avatar" id="avatarFallback">MA</div>
      <span class="status-dot" title="Available for opportunities"></span>
    </div>

    <h1>Marc Acebedo</h1>
    <p class="subtitle">MSc Data Analytics Candidate · UPF-BSM</p>
    <p class="location">Barcelona, España · Internship / Junior Opportunities</p>

    <div class="links-stack">
      <!-- 1. Descargar CV -->
      <a class="link-card primary" id="cvLink" href="cv.pdf" target="_blank" rel="noopener">
        <div class="link-left">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </div>
          <div class="link-text">
            <span class="link-title">Descargar CV (PDF)</span>
            <span class="link-sub">Currículum actualizado</span>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>

      <!-- 2. LinkedIn -->
      <a class="link-card" href="https://www.linkedin.com/in/marc-acebedo" target="_blank" rel="noopener">
        <div class="link-left">
          <div class="icon-box icon-linkedin">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
          </div>
          <div class="link-text">
            <span class="link-title">LinkedIn</span>
            <span class="link-sub">linkedin.com/in/marc-acebedo</span>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>

      <!-- 3. WhatsApp -->
      <a class="link-card" href="https://wa.me/34618736400?text=Hola%20Marc%2C%20nos%20hemos%20conocido%20en%20el%20evento%20de%20la%20UPF-BSM." target="_blank" rel="noopener">
        <div class="link-left">
          <div class="icon-box icon-whatsapp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </div>
          <div class="link-text">
            <span class="link-title">WhatsApp</span>
            <span class="link-sub">+34 618 73 64 00</span>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>

      <!-- 4. Correo electrónico (Directo mailto) -->
      <a class="link-card" href="mailto:marcaceboix@gmail.com?subject=Contacto%20-%20Evento%20UPF-BSM">
        <div class="link-left">
          <div class="icon-box icon-email">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <div class="link-text">
            <span class="link-title">Correo electrónico</span>
            <span class="link-sub">marcaceboix@gmail.com</span>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>
    </div>
  </div>

  <script>
    const PHOTO_URL = "foto.jpg";
    const CV_URL = "cv.pdf";

    document.getElementById("cvLink").href = CV_URL;

    if (PHOTO_URL) {
      const img = document.createElement("img");
      img.src = PHOTO_URL;
      img.alt = "Marc Acebedo";
      img.className = "avatar";
      img.onload = () => {
        const container = document.getElementById("avatarContainer");
        const fallback = document.getElementById("avatarFallback");
        if (fallback) container.replaceChild(img, fallback);
      };
    }
  </script>
</body>
</html>
